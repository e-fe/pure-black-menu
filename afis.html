<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>İndirim Afişleri · Pure Black</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap");
    :root { --display: "Bebas Neue", "Archivo Black", Impact, sans-serif; --sans: "Inter", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: var(--sans); background: #e5e5e5; color: #0a0a0a; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }

    /* Ekran araç çubuğu (yazdırılmaz) */
    .bar {
      position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid #d4d4d4;
    }
    .bar h1 { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .08em; margin: 0 8px 0 0; }
    .bar .info { color: #737373; font-size: 13px; }
    .bar .sp { flex: 1; }
    .seg { display: inline-flex; border: 1px solid #d4d4d4; border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 8px 12px; font-size: 13.5px; }
    .seg button.on { background: #0a0a0a; color: #fff; }
    .seg[hidden] { display: none; }
    .btn { border: 1px solid #0a0a0a; background: #0a0a0a; color: #fff; border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 14px; }
    .btn.ghost { background: #fff; color: #0a0a0a; border-color: #d4d4d4; text-decoration: none; }
    .tip { width: 100%; font-size: 12.5px; color: #737373; }
    .empty { text-align: center; padding: 80px 16px; color: #525252; }

    /* A4 sayfalar */
    .sheets { display: grid; justify-content: center; gap: 24px; padding: 24px 16px 60px; }
    .sheet {
      width: 210mm; height: 297mm; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.15);
      display: grid; overflow: hidden;
    }
    .sheet.a4 { grid-template: 1fr / 1fr; }
    .sheet.a5 { grid-template: repeat(2, 1fr) / 1fr; }
    .sheet.card { grid-template: repeat(2, 1fr) / repeat(2, 1fr); }
    .cell { position: relative; padding: 6mm; container-type: size; }
    .sheet.card .cell { padding: 4mm; }
    /* Kesim çizgileri */
    .sheet.a5 .cell + .cell { border-top: .3mm dashed #a3a3a3; }
    .sheet.card .cell:nth-child(2n) { border-left: .3mm dashed #a3a3a3; }
    .sheet.card .cell:nth-child(n+3) { border-top: .3mm dashed #a3a3a3; }

    /* Afiş */
    .banner {
      height: 100%; display: flex; flex-direction: column; text-align: center;
      border: max(1mm, 1cqmin) solid #0a0a0a; background: #fff;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .b-head { background: #0a0a0a; color: #fff; padding: 3.2cqmin 4cqmin 2.8cqmin; }
    .b-brand { font-family: var(--display); font-size: 9cqmin; letter-spacing: .16em; padding-left: .16em; line-height: 1; }
    .b-loc { font-size: 2.4cqmin; font-weight: 500; letter-spacing: .3em; padding-left: .3em; margin-top: 1.2cqmin; opacity: .8; }
    .b-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2cqmin; padding: 3cqmin 5cqmin; min-height: 0; }
    .b-deal { display: flex; flex-direction: column; align-items: center; line-height: .85; }
    .b-amount { font-family: var(--display); font-size: 30cqmin; letter-spacing: .01em; }
    .b-word { font-family: var(--display); font-size: 9cqmin; letter-spacing: .3em; padding-left: .3em; border-top: .8cqmin solid #0a0a0a; padding-top: 1.6cqmin; margin-top: .6cqmin; }
    .b-info { display: flex; flex-direction: column; align-items: center; gap: 2cqmin; }
    .b-name { font-family: var(--display); font-size: 10cqmin; letter-spacing: .04em; line-height: 1; margin-top: 2cqmin; }
    .b-desc { font-size: 3.2cqmin; color: #404040; max-width: 80%; line-height: 1.35; text-align: center; }
    .b-prices { display: flex; flex-wrap: wrap; justify-content: center; gap: 1cqmin 5cqmin; align-items: baseline; font-variant-numeric: tabular-nums; }
    .b-price { display: flex; align-items: baseline; gap: 2cqmin; }
    .b-price b { font-size: 3cqmin; letter-spacing: .1em; color: #525252; }
    .b-price s { font-size: 5cqmin; color: #737373; text-decoration-thickness: .5cqmin; }
    .b-price .now { font-family: var(--display); font-size: 12cqmin; line-height: 1; }
    .b-prices.multi .b-price .now { font-size: 8.5cqmin; }
    .b-prices.multi .b-price s { font-size: 3.8cqmin; }
    .b-foot { display: flex; align-items: center; justify-content: center; gap: 3cqmin; padding: 2.6cqmin; border-top: .4cqmin solid #0a0a0a; }
    .b-foot img { width: 13cqmin; height: 13cqmin; display: block; }
    .b-foot span { font-size: 2.8cqmin; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-align: left; line-height: 1.4; }

    /* Fotoğraflı afiş (dikey): üstte fotoğraf, altında solda indirim, sağda ürün */
    .b-photo { overflow: hidden; border: .4cqmin solid #0a0a0a; background: #f5f5f5; }
    .b-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-bw .b-photo img { filter: grayscale(1) contrast(1.05); }
    .banner.has-photo .b-body {
      display: grid; grid-template: "photo photo" minmax(0, 44cqh) "deal info" auto / auto 1fr;
      gap: 3.5cqmin 5cqmin; align-content: center; align-items: center; justify-items: start; text-align: left;
    }
    .banner.has-photo .b-photo { grid-area: photo; width: 100%; height: 100%; }
    .banner.has-photo .b-deal { grid-area: deal; }
    .banner.has-photo .b-amount { font-size: 19cqmin; }
    .banner.has-photo .b-word { font-size: 6cqmin; }
    .banner.has-photo .b-info { grid-area: info; align-items: flex-start; }
    .banner.has-photo .b-name { font-size: 8.5cqmin; margin-top: 0; }
    .banner.has-photo .b-desc { max-width: none; text-align: left; font-size: 3cqmin; }
    .banner.has-photo .b-prices { justify-content: flex-start; }
    .banner.has-photo .b-price .now { font-size: 10cqmin; }

    /* Yatay hücre (yarım sayfa): sol indirim, sağ ürün */
    @container (min-aspect-ratio: 5/4) {
      .b-body { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr; column-gap: 7cqmin; text-align: left; justify-items: start; align-items: center; }
      .b-deal { grid-row: 1 / 3; }
      .b-info { align-items: flex-start; }
      .b-name { margin-top: 0; font-size: 12cqmin; }
      .b-desc { max-width: none; font-size: 3.6cqmin; text-align: left; }
      .b-prices { justify-content: flex-start; }
      .b-head { display: flex; align-items: baseline; justify-content: space-between; padding: 2.6cqmin 5cqmin; }
      /* Fotoğraflı yatay: indirim | fotoğraf | ürün */
      .banner.has-photo .b-body { grid-template: "deal photo info" minmax(0, 1fr) / auto 54cqh minmax(0, 1fr); column-gap: 5cqmin; }
      .banner.has-photo .b-photo { width: 100%; height: 100%; min-height: 0; }
      .banner.has-photo .b-info { min-width: 0; }
      .banner.has-photo .b-amount { font-size: 24cqmin; }
      .banner.has-photo .b-word { font-size: 7.5cqmin; }
      .banner.has-photo .b-name { font-size: 10cqmin; }
      .b-loc { margin-top: 0; }
    }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheets { display: block; padding: 0; }
      .sheet { box-shadow: none; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }
    @media screen and (max-width: 860px) {
      /* Telefonda önizleme: sayfaları ekrana sığdır */
      .sheets { zoom: .42; padding: 16px 8px 40px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1>İNDİRİM AFİŞLERİ</h1>
    <span class="info" id="info"></span>
    <span class="sp"></span>
    <div class="seg" id="sizeSeg">
      <button data-s="a4">Büyük afiş · 1</button>
      <button data-s="a5">Yarım sayfa · 2</button>
      <button data-s="card">Masa kartı · 4</button>
    </div>
    <div class="seg" id="photoSeg" title="Afişteki fotoğraflar">
      <button data-p="color">Fotoğraf: Renkli</button>
      <button data-p="bw">Siyah-beyaz</button>
    </div>
    <a class="btn ghost" href="admin.html">← Panel</a>
    <button class="btn" id="printBtn">⎙ Yazdır / PDF</button>
    <div class="tip">A4, kenar boşluğu yok. Yazdırma penceresinde "Arka plan grafikleri" kapalıysa açın; PDF için hedef olarak "PDF olarak kaydet"i seçin.</div>
  </div>
  <main class="sheets" id="sheets"></main>
  <script type="module" src="js/afis.js"></script>
</body>
</html>
